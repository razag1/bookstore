
services:
  db:
    image: postgres:17-alpine

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - bookstore_network

  web:
    build: .

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - bookstore_network

volumes:
  postgres_data:

networks:
  bookstore_network:
    name: bookstore_network
    driver: bridge
